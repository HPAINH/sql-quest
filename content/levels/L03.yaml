  - id: L03-14
    type: choose
    difficulty: 2
    customer: Обучение
    title: Сколько покупателей
    ticket: Какие запросы вернут число клиентов, сделавших хотя бы один заказ? Отметьте все верные.
    tables: [orders, customers]
    expected_columns: [count]
    reference: |
      SELECT COUNT(DISTINCT customer_id) FROM orders;
    options:
      - SELECT COUNT(DISTINCT customer_id) FROM orders;
      - SELECT COUNT(customer_id) FROM orders;
      - SELECT COUNT(*) FROM customers;
      - SELECT COUNT(*) FROM (SELECT DISTINCT customer_id FROM orders) AS t;
    hints:
      - Один клиент может встречаться в orders много раз.
      - "Нужно число уникальных customer_id в заказах."
      - "1) COUNT(customer_id) считает заказы. 2) COUNT(*) FROM customers считает и тех, кто ничего не покупал."
      - DISTINCT можно применить внутри COUNT или в подзапросе.
      - "Верны COUNT(DISTINCT customer_id) и подсчёт строк в подзапросе с DISTINCT — это одно и то же разными словами."

  - id: L03-15
    type: write_query
    boss: true
    difficulty: 3
    customer: Финансы
    title: "Инцидент: квартальный отчёт"
    ticket: |
      Сломался дашборд финансов, а отчёт нужен сегодня. По кварталам 2025 года:
      quarter — номер квартала (1–4); orders_cnt — всего заказов; delivered_revenue — сумма amount доставленных заказов; cancel_rate — доля отменённых заказов в процентах, округлить до 1 знака; avg_check — средний чек доставленных заказов, округлить до копеек.
      Сортировка по кварталу.
    tables: [orders]
    expected_columns: [quarter, orders_cnt, delivered_revenue, cancel_rate, avg_check]
    check_column_names: true
    ordered: true
    order_keys: [quarter]
    required: [group_by]
    reference: |
      SELECT EXTRACT(QUARTER FROM created_at) AS quarter,
             COUNT(*) AS orders_cnt,
             SUM(amount) FILTER (WHERE status = 'delivered') AS delivered_revenue,
             round(100.0 * COUNT(*) FILTER (WHERE status = 'cancelled') / COUNT(*), 1) AS cancel_rate,
             round(AVG(amount) FILTER (WHERE status = 'delivered'), 2) AS avg_check
      FROM orders
      WHERE created_at >= '2025-01-01'
        AND created_at < '2026-01-01'
      GROUP BY quarter
      ORDER BY quarter;
    hints:
      - Все показатели считаются в одной группировке — по кварталу. Разные статусы — через FILTER.
      - "EXTRACT(QUARTER FROM created_at) даёт номер квартала."
      - "1) WHERE — 2025 год (все статусы!). 2) GROUP BY квартал. 3) Пять агрегатов, три из них с FILTER. 4) Доля = 100.0 × отменённые / все."
      - "round(100.0 * COUNT(*) FILTER (WHERE status = 'cancelled') / COUNT(*), 1) AS cancel_rate"
      - "Фильтровать delivered в WHERE нельзя: тогда пропадут отменённые заказы и cancel_rate станет нулём. FILTER позволяет посчитать разные срезы в одной группе. 100.0 делает деление дробным."
