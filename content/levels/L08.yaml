level: 8
grade: Middle
title: Оконные функции II
tag: LAG
book_chapter: 10
summary: Смотрим на соседние строки и накапливаем — изменения к прошлому периоду, нарастающие итоги, скользящие средние, квантили и рамки окна.
theory: |
  **Соседние строки.** `LAG(x)` берёт значение из предыдущей строки окна, `LEAD(x)` — из следующей. Второй аргумент — смещение, третий — значение по умолчанию: `LAG(revenue, 1, 0) OVER (ORDER BY month)`.

  **Нарастающий итог** — агрегат с ORDER BY в окне:

  ```sql
  SUM(revenue) OVER (ORDER BY month) AS cumulative
  ```

  **Рамка окна** уточняет, какие строки вокруг текущей входят в расчёт:

  ```sql
  AVG(revenue) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)
  ```

  Это скользящее среднее за 7 строк: текущая и 6 предыдущих.

  - `ROWS` считает физические строки;
  - `RANGE` считает по значению ORDER BY — строки с одинаковым значением («пиры») попадают в рамку вместе.

  **Ловушка рамки по умолчанию.** Если в OVER есть ORDER BY, рамка по умолчанию — `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`. Поэтому нарастающий итог работает «сам», а `LAST_VALUE` возвращает текущую строку. Для последнего значения окна укажите `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`.

  **Квантили:** `NTILE(4) OVER (ORDER BY total DESC)` делит строки на 4 почти равные группы. `PERCENT_RANK()` и `CUME_DIST()` дают относительное положение строки от 0 до 1.

  `FIRST_VALUE(x)` — значение из первой строки окна, удобно для «самого дешёвого в категории» или «первой покупки клиента».

  Чтобы не повторять одно окно несколько раз, его можно назвать: `… OVER w FROM t WINDOW w AS (PARTITION BY … ORDER BY …)`.
tasks:
  - id: L08-01
    type: write_query
    difficulty: 2
    customer: Финансы
    title: Месяц к месяцу
    ticket: Выручка доставленных заказов по месяцам 2025 года и её изменение к предыдущему месяцу — month (date), revenue, prev_revenue и diff (у января prev_revenue и diff пустые).
    tables: [orders]
    expected_columns: [month, revenue, prev_revenue, diff]
    check_column_names: true
    ordered: true
    required: [lag]
    reference: |
      WITH m AS (
        SELECT date_trunc('month', created_at)::date AS month, SUM(amount) AS revenue
        FROM orders
        WHERE status = 'delivered' AND created_at >= '2025-01-01' AND created_at < '2026-01-01'
        GROUP BY month
      )
      SELECT month, revenue,
             LAG(revenue) OVER (ORDER BY month) AS prev_revenue,
             revenue - LAG(revenue) OVER (ORDER BY month) AS diff
      FROM m
      ORDER BY month;
    hints:
      - Сначала выручка по месяцам, потом значение предыдущей строки.
      - "LAG(revenue) OVER (ORDER BY month)."
      - "1) CTE с выручкой по месяцам. 2) LAG для prev_revenue. 3) diff = revenue − LAG."
      - "LAG(revenue) OVER (ORDER BY ___) AS prev_revenue"
      - "LAG смотрит на строку выше в порядке окна. У первой строки предыдущей нет, поэтому результат NULL — и разность тоже NULL."

  - id: L08-02
    type: write_query
    difficulty: 2
    customer: CRM
    title: Когда вернулся
    ticket: Для клиентов из Воронежа — каждый заказ и время следующего заказа того же клиента. customer_id, order_id, created_at, next_order_at (у последнего заказа пусто).
    tables: [orders, customers]
    expected_columns: [customer_id, order_id, created_at, next_order_at]
    check_column_names: true
    required: [lead]
    reference: |
      SELECT o.customer_id, o.order_id, o.created_at,
             LEAD(o.created_at) OVER (PARTITION BY o.customer_id ORDER BY o.created_at) AS next_order_at
      FROM orders AS o
      JOIN customers AS c ON c.customer_id = o.customer_id
      WHERE c.city = 'Воронеж';
    hints:
      - Следующая строка в истории клиента — функция, обратная LAG.
      - "LEAD(created_at) OVER (PARTITION BY customer_id ORDER BY created_at)."
      - "1) Отфильтруй клиентов Воронежа. 2) LEAD внутри окна клиента."
      - "___(o.created_at) OVER (PARTITION BY o.customer_id ORDER BY o.created_at)"
      - "PARTITION BY не даёт LEAD заглянуть в заказы другого клиента: у последнего заказа каждого клиента значение пустое."

  - id: L08-03
    type: write_query
    difficulty: 1
    customer: Финансы
    title: Нарастающим итогом
    ticket: Выручка доставленных заказов по месяцам 2025 года и нарастающий итог с начала года — month (date), revenue, cumulative.
    tables: [orders]
    expected_columns: [month, revenue, cumulative]
    check_column_names: true
    ordered: true
    required: [window]
    reference: |
      WITH m AS (
        SELECT date_trunc('month', created_at)::date AS month, SUM(amount) AS revenue
        FROM orders
        WHERE status = 'delivered' AND created_at >= '2025-01-01' AND created_at < '2026-01-01'
        GROUP BY month
      )
      SELECT month, revenue, SUM(revenue) OVER (ORDER BY month) AS cumulative
      FROM m
      ORDER BY month;
    hints:
      - Нарастающий итог — это сумма всех строк от начала до текущей.
      - "SUM(revenue) OVER (ORDER BY month)."
      - "1) Выручка по месяцам. 2) Оконная сумма с сортировкой по месяцу."
      - "SUM(revenue) OVER (ORDER BY ___) AS cumulative"
      - "С ORDER BY рамка окна по умолчанию — от начала до текущей строки, поэтому SUM становится нарастающим итогом."

  - id: L08-04
    type: write_query
    difficulty: 2
    customer: Финансы
    title: Скользящая неделя
    ticket: Выручка доставленных заказов по дням июня 2026 года и скользящее среднее за 7 дней (текущий и 6 предыдущих дней с продажами) — day, revenue, ma7 (2 знака).
    tables: [orders]
    expected_columns: [day, revenue, ma7]
    check_column_names: true
    ordered: true
    required: [rows]
    reference: |
      WITH d AS (
        SELECT created_at::date AS day, SUM(amount) AS revenue
        FROM orders
        WHERE status = 'delivered' AND created_at >= '2026-06-01' AND created_at < '2026-07-01'
        GROUP BY day
      )
      SELECT day, revenue,
             round(AVG(revenue) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW), 2) AS ma7
      FROM d
      ORDER BY day;
    hints:
      - Нужно среднее по скользящему окну фиксированного размера.
      - "Рамка ROWS BETWEEN 6 PRECEDING AND CURRENT ROW — это 7 строк."
      - "1) Выручка по дням. 2) AVG с рамкой из 7 строк. 3) Округление."
      - "AVG(revenue) OVER (ORDER BY day ROWS BETWEEN ___ PRECEDING AND CURRENT ROW)"
      - "6 предыдущих + текущая = 7 строк. В первые дни месяца окно короче, и среднее считается по тому, что есть."

  - id: L08-05
    type: write_query
    difficulty: 2
    customer: CRM
    title: Квартили клиентов
    ticket: Разделите клиентов на четыре равные группы по сумме доставленных заказов за 2025 год — customer_id, total, quartile (1 — самые крупные). При равной сумме меньший customer_id идёт раньше.
    tables: [orders]
    expected_columns: [customer_id, total, quartile]
    check_column_names: true
    required: [ntile]
    reference: |
      WITH t AS (
        SELECT customer_id, SUM(amount) AS total
        FROM orders
        WHERE status = 'delivered' AND created_at >= '2025-01-01' AND created_at < '2026-01-01'
        GROUP BY customer_id
      )
      SELECT customer_id, total,
             NTILE(4) OVER (ORDER BY total DESC, customer_id) AS quartile
      FROM t;
    hints:
      - Деление на равные по количеству группы — отдельная оконная функция.
      - "NTILE(4) OVER (ORDER BY total DESC, customer_id)."
      - "1) Суммы по клиентам за 2025 год. 2) NTILE(4) с сортировкой от крупных."
      - "___(4) OVER (ORDER BY total DESC, customer_id) AS quartile"
      - "NTILE раскладывает строки по порядку в N групп почти одинакового размера. Второй ключ сортировки делает разбиение воспроизводимым при равных суммах."

  - id: L08-06
    type: write_query
    difficulty: 2
    customer: Каталог
    title: Самый доступный рядом
    ticket: Для всех наушников (category_id = 9) — product_id, name, price и cheapest — название самого дешёвого товара этой категории (при равной цене — с меньшим product_id).
    tables: [products]
    expected_columns: [product_id, name, price, cheapest]
    check_column_names: true
