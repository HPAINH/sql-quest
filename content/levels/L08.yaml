  - id: L08-10
    type: predict
    difficulty: 3
    customer: Обучение
    title: Пиры в рамке
    ticket: Что вернёт запрос?
    tables: []
    query: |
      SELECT s
      FROM (
        SELECT x, SUM(x) OVER (ORDER BY x) AS s
        FROM (VALUES (1), (2), (2), (3)) AS t(x)
      ) AS q
      WHERE x = 2
      LIMIT 1;
    ask: value
    distractor_values: ['3', '1', '8']
    hints:
      - Вспомни, какая рамка используется по умолчанию при ORDER BY в окне.
      - "Рамка по умолчанию — RANGE: строки с тем же значением ORDER BY входят в неё вместе."
      - "1) Для первой двойки рамка включает 1 и обе двойки. 2) Сложи."
      - "1 + 2 + 2 = ___"
      - "RANGE включает в рамку всех «пиров» — строки с одинаковым x. Поэтому у обеих двоек нарастающий итог 5, а не 3 и 5. С ROWS первая двойка получила бы 3."

  - id: L08-11
    type: choose
    difficulty: 3
    customer: Обучение
    title: Нарастающий итог клиента
    ticket: Нужен нарастающий итог суммы заказов каждого клиента из Ростова-на-Дону по времени — customer_id, order_id, running. Какие запросы верны? Отметьте все.
    tables: [orders, customers]
    expected_columns: [customer_id, order_id, running]
    reference: |
      SELECT o.customer_id, o.order_id, SUM(o.amount) OVER (PARTITION BY o.customer_id ORDER BY o.created_at) AS running FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE c.city = 'Ростов-на-Дону';
    options:
      - SELECT o.customer_id, o.order_id, SUM(o.amount) OVER (PARTITION BY o.customer_id ORDER BY o.created_at) AS running FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE c.city = 'Ростов-на-Дону';
      - SELECT o.customer_id, o.order_id, SUM(o.amount) OVER (PARTITION BY o.customer_id) AS running FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE c.city = 'Ростов-на-Дону';
      - SELECT o.customer_id, o.order_id, SUM(o.amount) OVER (PARTITION BY o.customer_id ORDER BY o.created_at ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE c.city = 'Ростов-на-Дону';
      - SELECT o.customer_id, o.order_id, SUM(o.amount) OVER (ORDER BY o.created_at) AS running FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE c.city = 'Ростов-на-Дону';
    expect_correct: [0, 2]
    hints:
      - Итог должен копиться отдельно для каждого клиента и расти по времени.
      - "Без ORDER BY в окне сумма одинакова во всех строках клиента."
      - "Без PARTITION BY сумма копится по всем клиентам сразу."
      - Время заказов одного клиента не совпадает, поэтому ROWS и RANGE здесь дают одно и то же.
      - "Верны варианты с PARTITION BY клиента и ORDER BY по времени — с явной рамкой ROWS и без неё."

  - id: L08-12
    type: target_table
    difficulty: 2
    customer: Маркетинг
    title: Рост базы
    ticket: Получите таблицу как на образце — новые клиенты по месяцам регистрации в 2025 году и накопительное число клиентов, зарегистрированных с начала 2025 года.
    tables: [customers]
    expected_columns: [month, new_customers, total_customers]
    ordered: true
    required: [window]
    reference: |
      SELECT date_trunc('month', registered_at)::date AS month,
             COUNT(*) AS new_customers,
             SUM(COUNT(*)) OVER (ORDER BY date_trunc('month', registered_at)::date) AS total_customers
      FROM customers
      WHERE registered_at >= '2025-01-01' AND registered_at < '2026-01-01'
      GROUP BY month
      ORDER BY month;
    hints:
      - Это нарастающий итог по результату группировки.
      - "Оконную функцию можно применить к агрегату: SUM(COUNT(*)) OVER (ORDER BY …)."
      - "1) Группировка регистраций по месяцам. 2) Оконная сумма количеств по месяцам."
      - "SUM(COUNT(*)) OVER (ORDER BY date_trunc('month', registered_at)::date) AS total_customers"
      - "Окна считаются после GROUP BY, поэтому внутрь окна можно поставить агрегат группы. Можно и в два шага через CTE."

  - id: L08-13
    type: write_query
    boss: true
    difficulty: 3
    customer: Финансы
    title: "Инцидент: дневная динамика"
    ticket: |
      Дашборд продаж за июнь 2026 года сломался, финансовый директор просит таблицу вручную. По дням с продажами (доставленные заказы):
      day; revenue; dod_pct — изменение к предыдущему дню в процентах (1 знак, у первого дня пусто); ma7 — скользящее среднее за 7 дней (текущий и 6 предыдущих дней с продажами, 2 знака); best_so_far — лучшая дневная выручка с начала месяца по текущий день включительно.
      Сортировка по дню.
    tables: [orders]
    expected_columns: [day, revenue, dod_pct, ma7, best_so_far]
    check_column_names: true
    ordered: true
    required: [lag, rows]
    reference: |
      WITH d AS (
        SELECT created_at::date AS day, SUM(amount) AS revenue
        FROM orders
        WHERE status = 'delivered' AND created_at >= '2026-06-01' AND created_at < '2026-07-01'
        GROUP BY day
      )
      SELECT day, revenue,
             round(100 * (revenue - LAG(revenue) OVER w) / NULLIF(LAG(revenue) OVER w, 0), 1) AS dod_pct,
             round(AVG(revenue) OVER (w ROWS BETWEEN 6 PRECEDING AND CURRENT ROW), 2) AS ma7,
             MAX(revenue) OVER (w ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS best_so_far
      FROM d
      WINDOW w AS (ORDER BY day)
      ORDER BY day;
    hints:
      - Все три показателя — окна по одному порядку дней. Посчитай выручку по дням в CTE и добавь окна.
      - "dod_pct через LAG, ma7 через AVG с рамкой ROWS, best_so_far через MAX с нарастающей рамкой."
      - "1) CTE d: выручка по дням. 2) LAG для изменения. 3) AVG с рамкой 6 PRECEDING. 4) MAX нарастающим окном. 5) Чтобы не повторять OVER, объяви WINDOW w AS (ORDER BY day)."
      - "round(100 * (revenue - LAG(revenue) OVER w) / NULLIF(LAG(revenue) OVER w, 0), 1) AS dod_pct, round(AVG(revenue) OVER (w ROWS BETWEEN 6 PRECEDING AND CURRENT ROW), 2) AS ma7, MAX(revenue) OVER (w ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS best_so_far … WINDOW w AS (ORDER BY day)"
      - "Именованное окно задаёт порядок один раз, а каждая функция уточняет свою рамку. NULLIF защищает от деления на ноль, а у первого дня LAG пуст, поэтому и процент пуст."
