    hints:
      - Нужно значение из первой строки окна, отсортированного по цене.
      - "FIRST_VALUE(name) OVER (ORDER BY price, product_id)."
      - "1) Фильтр категории. 2) FIRST_VALUE имени по возрастанию цены."
      - "___(name) OVER (PARTITION BY category_id ORDER BY price, product_id)"
      - "Для первой строки окна рамка по умолчанию подходит: она всегда начинается с начала окна. С LAST_VALUE так не получится."

  - id: L08-07
    type: write_query
    difficulty: 3
    customer: CRM
    title: Вернувшиеся
    ticket: |
      Найдите возвраты после долгого перерыва — заказы, сделанные больше чем через 180 дней после предыдущего заказа того же клиента.
      Колонки customer_id, order_id, gap_days (число полных дней между заказами).
    tables: [orders]
    expected_columns: [customer_id, order_id, gap_days]
    check_column_names: true
    required: [lag]
    reference: |
      WITH g AS (
        SELECT customer_id, order_id, created_at,
               LAG(created_at) OVER (PARTITION BY customer_id ORDER BY created_at) AS prev_at
        FROM orders
      )
      SELECT customer_id, order_id, EXTRACT(DAY FROM created_at - prev_at)::int AS gap_days
      FROM g
      WHERE created_at - prev_at > interval '180 days';
    hints:
      - Для каждого заказа нужна дата предыдущего заказа того же клиента.
      - "LAG(created_at) OVER (PARTITION BY customer_id ORDER BY created_at)."
      - "1) CTE с prev_at. 2) Снаружи фильтр по разности. 3) Полные дни — EXTRACT(DAY FROM интервал)."
      - "… WHERE created_at - prev_at > interval '___ days'"
      - "Разность timestamp даёт интервал вида «200 days 05:12:00»; EXTRACT(DAY …) берёт из него целые дни. Фильтр стоит снаружи, потому что окна в WHERE недоступны."

  - id: L08-08
    type: fix_bug
    difficulty: 2
    customer: CRM
    title: Последний заказ рядом
    ticket: Для каждого заказа клиентов из Перми нужна дата последнего заказа этого клиента — customer_id, order_id, last_order_at. Запрос возвращает дату текущего заказа. Почините.
    tables: [orders, customers]
    expected_columns: [customer_id, order_id, last_order_at]
    broken_query: |
      SELECT o.customer_id, o.order_id,
             LAST_VALUE(o.created_at) OVER (PARTITION BY o.customer_id ORDER BY o.created_at) AS last_order_at
      FROM orders AS o
      JOIN customers AS c ON c.customer_id = o.customer_id
      WHERE c.city = 'Пермь';
    reference: |
      SELECT o.customer_id, o.order_id,
             LAST_VALUE(o.created_at) OVER (
               PARTITION BY o.customer_id ORDER BY o.created_at
               ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING
             ) AS last_order_at
      FROM orders AS o
      JOIN customers AS c ON c.customer_id = o.customer_id
      WHERE c.city = 'Пермь';
    hints:
      - Подумай, где заканчивается окно по умолчанию.
      - "С ORDER BY рамка по умолчанию — от начала до текущей строки."
      - "1) Расширь рамку до конца окна. 2) Или используй MAX без ORDER BY."
      - "OVER (PARTITION BY o.customer_id ORDER BY o.created_at ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED ___)"
      - "Рамка по умолчанию обрывается на текущей строке, и последней в ней оказывается она сама. Полная рамка или MAX(created_at) OVER (PARTITION BY customer_id) дают последнюю дату клиента."

