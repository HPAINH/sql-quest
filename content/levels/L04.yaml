  - id: L04-06
    type: write_query
    difficulty: 2
    customer: Финансы
    title: Выручка по категориям
    ticket: Выручка по категориям — category (название) и revenue (сумма quantity × price позиций доставленных заказов), по убыванию выручки.
    tables: [order_items, orders, products, categories]
    expected_columns: [category, revenue]
    check_column_names: true
    ordered: true
    order_keys: [revenue]
    required: [join, group_by]
    reference: |
      SELECT c.name AS category, SUM(oi.quantity * oi.price) AS revenue
      FROM order_items AS oi
      JOIN orders AS o ON o.order_id = oi.order_id
      JOIN products AS p ON p.product_id = oi.product_id
      JOIN categories AS c ON c.category_id = p.category_id
      WHERE o.status = 'delivered'
      GROUP BY c.name
      ORDER BY revenue DESC;
    hints:
      - Цепочка из четырёх таблиц — позиция → заказ (статус) и позиция → товар → категория.
      - "order_items связан с orders по order_id и с products по product_id; products — с categories по category_id."
      - "1) Соедини четыре таблицы. 2) Только delivered. 3) GROUP BY название категории. 4) SUM(quantity * price)."
      - "SELECT c.name AS category, SUM(oi.quantity * oi.price) AS revenue FROM order_items oi JOIN orders o ON … JOIN products p ON … JOIN categories c ON … WHERE o.status = 'delivered' GROUP BY c.name ORDER BY revenue DESC;"
      - "JOIN-ы можно выстраивать цепочкой. Агрегат считается после соединения, поэтому статус заказа доступен в WHERE."

