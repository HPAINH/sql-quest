  - id: L04-09
    type: write_query
    difficulty: 2
    customer: Качество
    title: Отзывы на Aroma
    ticket: Сколько отзывов у каждого товара бренда Aroma, включая товары без отзывов? Колонки name и reviews_cnt.
    tables: [products, reviews]
    expected_columns: [name, reviews_cnt]
    check_column_names: true
    required: [join]
    reference: |
      SELECT p.name, COUNT(r.review_id) AS reviews_cnt
      FROM products AS p
      LEFT JOIN reviews AS r ON r.product_id = p.product_id
      WHERE p.brand = 'Aroma'
      GROUP BY p.product_id, p.name;
    common_mistakes:
      - pattern: "count\\s*\\(\\s*\\*\\s*\\)"
        result: values_bigger
        explain: "COUNT(*) после LEFT JOIN считает и строку-заглушку: у товара без отзывов получится 1. Считай колонку правой таблицы — COUNT(r.review_id)."
    hints:
      - «Включая товары без отзывов» — значит LEFT JOIN, и у таких товаров должен получиться 0.
      - "products LEFT JOIN reviews по product_id, затем группировка по товару."
      - "1) LEFT JOIN. 2) Фильтр бренда. 3) GROUP BY товар. 4) Считай не строки, а отзывы."
      - "SELECT p.name, COUNT(r.___) AS reviews_cnt … GROUP BY p.product_id, p.name;"
      - "COUNT(*) посчитал бы строку-заглушку с NULL как отзыв. COUNT(r.review_id) пропускает NULL и даёт честный 0. Группировка по product_id нужна на случай одинаковых названий."

  - id: L04-10
    type: fix_bug
    difficulty: 3
    customer: CRM
    title: Раздутая активность
    ticket: |
      Отчёт по клиентам из Перми показывает подозрительно большие цифры — у некоторых клиентов десятки заказов и отзывов. Нужно: customer_id, orders_cnt, reviews_cnt (0, если нет). Почините.
    tables: [customers, orders, reviews]
    expected_columns: [customer_id, orders_cnt, reviews_cnt]
    check_column_names: true
    broken_query: |
      SELECT c.customer_id,
             COUNT(o.order_id) AS orders_cnt,
             COUNT(r.review_id) AS reviews_cnt
      FROM customers AS c
      LEFT JOIN orders AS o ON o.customer_id = c.customer_id
      LEFT JOIN reviews AS r ON r.customer_id = c.customer_id
      WHERE c.city = 'Пермь'
      GROUP BY c.customer_id;
    reference: |
      SELECT c.customer_id,
             COUNT(DISTINCT o.order_id) AS orders_cnt,
             COUNT(DISTINCT r.review_id) AS reviews_cnt
      FROM customers AS c
      LEFT JOIN orders AS o ON o.customer_id = c.customer_id
      LEFT JOIN reviews AS r ON r.customer_id = c.customer_id
      WHERE c.city = 'Пермь'
      GROUP BY c.customer_id;
    hints:
      - Два LEFT JOIN к разным «многим» таблицам перемножают строки.
      - "Клиент с 4 заказами и 3 отзывами даёт 4 × 3 = 12 строк до группировки."
      - "1) Пойми, что каждый заказ повторяется столько раз, сколько у клиента отзывов. 2) Посчитай уникальные идентификаторы."
      - "COUNT(___ o.order_id), COUNT(___ r.review_id)"
      - "Соединение с двумя независимыми таблицами даёт декартово произведение их строк для каждого клиента. COUNT(DISTINCT id) снимает повторы. Другой способ — посчитать заказы и отзывы в подзапросах и соединить готовые числа."

  - id: L04-11
    type: fix_bug
    difficulty: 1
    customer: Поддержка
    title: Неоднозначная колонка
    ticket: Нужны заказы клиентов из Уфы за май 2026 года — order_id, customer_id, email. Запрос падает с ошибкой. Почините.
    tables: [orders, customers]
    expected_columns: [order_id, customer_id, email]
    broken_query: |
      SELECT order_id, customer_id, email
      FROM orders
      JOIN customers ON orders.customer_id = customers.customer_id
      WHERE city = 'Уфа'
        AND created_at >= '2026-05-01'
        AND created_at < '2026-06-01';
    reference: |
      SELECT o.order_id, o.customer_id, c.email
      FROM orders AS o
      JOIN customers AS c ON o.customer_id = c.customer_id
      WHERE c.city = 'Уфа'
        AND o.created_at >= '2026-05-01'
        AND o.created_at < '2026-06-01';
    hints:
      - СУБД не понимает, из какой таблицы брать одну из колонок.
      - "customer_id есть и в orders, и в customers."
      - "1) Найди колонку, которая есть в обеих таблицах. 2) Уточни её префиксом таблицы."
      - "SELECT order_id, ___.customer_id, email …"
      - "Ошибка «column reference is ambiguous» значит, что имя есть в нескольких таблицах. Префикс (orders.customer_id или o.customer_id) снимает неоднозначность. Хорошая привычка — уточнять все колонки в запросах с JOIN."

  - id: L04-12
    type: predict
    difficulty: 1
    customer: Обучение
    title: Все со всеми
    ticket: Сколько строк вернёт запрос? В warehouses 5 строк, в promo_codes — 30.
    tables: [warehouses, promo_codes]
    query: |
      SELECT *
      FROM warehouses
      CROSS JOIN promo_codes;
    ask: rows
    distractor_values: [35, 30, 5]
    hints:
      - CROSS JOIN соединяет каждую строку с каждой.
      - "Сколько пар можно составить из 5 и 30 элементов?"
      - "1) Каждый склад получает в пару все промокоды. 2) Умножь."
      - "5 × 30 = ___"
      - "CROSS JOIN — декартово произведение: 5 × 30 = 150 строк. Случайно получить такое легко, если забыть условие соединения."

  - id: L04-13
    type: choose
    difficulty: 3
    customer: Обучение
    title: Нули не должны пропасть
    ticket: |
      Нужны все клиенты из Уфы и количество их заказов в 2026 году; у клиентов без заказов должен быть 0. Какие запросы верны? Отметьте все.
    tables: [customers, orders]
    expected_columns: [customer_id, orders_2026]
    reference: |
      SELECT c.customer_id, COUNT(o.order_id) AS orders_2026 FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id AND o.created_at >= '2026-01-01' WHERE c.city = 'Уфа' GROUP BY c.customer_id;
    options:
      - SELECT c.customer_id, COUNT(o.order_id) AS orders_2026 FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id AND o.created_at >= '2026-01-01' WHERE c.city = 'Уфа' GROUP BY c.customer_id;
      - SELECT c.customer_id, COUNT(o.order_id) AS orders_2026 FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id WHERE c.city = 'Уфа' AND o.created_at >= '2026-01-01' GROUP BY c.customer_id;
      - SELECT c.customer_id, COUNT(*) AS orders_2026 FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id AND o.created_at >= '2026-01-01' WHERE c.city = 'Уфа' GROUP BY c.customer_id;
      - SELECT c.customer_id, COUNT(o.order_id) FILTER (WHERE o.created_at >= '2026-01-01') AS orders_2026 FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id WHERE c.city = 'Уфа' GROUP BY c.customer_id;
    hints:
      - Проверь каждый вариант на клиенте, у которого нет заказов в 2026 году.
      - "Условие на правую таблицу в WHERE отбрасывает строки-заглушки с NULL."
      - "1) Где стоит фильтр по дате — в ON или в WHERE? 2) Что считает COUNT(*) для заглушки?"
      - Фильтр можно перенести в ON или в FILTER — тогда заглушка выживет.
      - "Верны варианты с условием на дату в ON и с FILTER: оба сохраняют клиентов без заказов. Фильтр в WHERE превращает LEFT JOIN в INNER и теряет нули, а COUNT(*) считает строку-заглушку как 1."

  - id: L04-14
    type: target_table
    difficulty: 2
    customer: Логистика
    title: Остатки по складам
    ticket: Получите таблицу как на образце — склады с городом и суммарным остатком товаров, от больших остатков к меньшим.
    tables: [warehouses, stock]
    expected_columns: [name, city, total_qty]
    ordered: true
    order_keys: [total_qty]
    reference: |
      SELECT w.name, w.city, SUM(s.qty) AS total_qty
      FROM warehouses AS w
      JOIN stock AS s ON s.warehouse_id = w.warehouse_id
      GROUP BY w.warehouse_id, w.name, w.city
      ORDER BY total_qty DESC;
    hints:
      - Остатки лежат в stock, а названия складов — в warehouses.
      - "Соединяй по warehouse_id, группируй по складу."
      - "1) JOIN. 2) GROUP BY склад. 3) SUM(qty). 4) Сортировка по убыванию."
      - "SELECT w.name, w.city, SUM(s.qty) AS total_qty FROM warehouses w JOIN stock s ON … GROUP BY w.warehouse_id, w.name, w.city ORDER BY ___ DESC;"
      - "Каждая колонка SELECT вне агрегата должна быть в GROUP BY. Группировка по warehouse_id гарантирует, что одноимённые склады не склеятся."

  - id: L04-15
    type: write_query
    boss: true
    difficulty: 3
    customer: Руководство
    title: "Инцидент: что мы продаём"
    ticket: |
      Совет директоров спрашивает, какие направления бизнеса работают, а какие — нет. По каждой корневой категории (у которой нет родителя):
      root_category — название; products_total — товаров в ней (включая все подкатегории любой глубины); never_sold — сколько из них ни разу не продавались; revenue — сумма quantity × price по позициям доставленных заказов (0, если продаж нет).
      Сортировка по revenue по убыванию. Учтите, что «Игровые смартфоны» вложены в «Смартфоны», а те — в «Электронику».
    tables: [categories, products, order_items, orders]
    expected_columns: [root_category, products_total, never_sold, revenue]
    check_column_names: true
    ordered: true
    order_keys: [revenue]
    required: [join, group_by]
    reference: |
      SELECT COALESCE(gp.name, pc.name, c.name) AS root_category,
             COUNT(DISTINCT p.product_id) AS products_total,
             COUNT(DISTINCT p.product_id) FILTER (WHERE oi.product_id IS NULL) AS never_sold,
             COALESCE(SUM(oi.quantity * oi.price) FILTER (WHERE o.status = 'delivered'), 0) AS revenue
      FROM products AS p
      JOIN categories AS c ON c.category_id = p.category_id
      LEFT JOIN categories AS pc ON pc.category_id = c.parent_id
      LEFT JOIN categories AS gp ON gp.category_id = pc.parent_id
      LEFT JOIN order_items AS oi ON oi.product_id = p.product_id
      LEFT JOIN orders AS o ON o.order_id = oi.order_id
      GROUP BY root_category
      ORDER BY revenue DESC;
    hints:
      - "Корень находится максимум через два шага по parent_id: категория → родитель → прародитель."
      - "Присоедини categories к себе дважды через LEFT JOIN; корнем будет последний непустой уровень — COALESCE(прародитель, родитель, сама категория)."
      - "1) products → categories → родитель → прародитель (LEFT). 2) LEFT JOIN продаж и заказов. 3) Группировка по корню. 4) COUNT(DISTINCT), FILTER и COALESCE."
      - "COALESCE(gp.name, pc.name, c.name) AS root_category, COUNT(DISTINCT p.product_id), COUNT(DISTINCT p.product_id) FILTER (WHERE oi.product_id IS NULL), COALESCE(SUM(oi.quantity * oi.price) FILTER (WHERE o.status = 'delivered'), 0)"
      - "Self-join дважды поднимает категорию до корня. LEFT JOIN к продажам сохраняет непроданные товары, поэтому товары считаются через COUNT(DISTINCT), а непроданные — по признаку oi.product_id IS NULL. SUM без подходящих строк даёт NULL — COALESCE превращает его в 0."
