level: 4
grade: Junior
title: JOIN
tag: JOIN
book_chapter: 6
summary: Соединяем таблицы — заказы с клиентами, товары с категориями, сотрудников с руководителями. Учимся не терять и не размножать строки.
theory: |
  Данные разложены по таблицам, а отчёты почти всегда требуют их соединить.

  ```sql
  SELECT o.order_id, c.first_name
  FROM orders AS o
  JOIN customers AS c ON c.customer_id = o.customer_id;
  ```

  `o` и `c` — псевдонимы таблиц. Если колонка с одинаковым именем есть в обеих таблицах, её нужно уточнить: `o.customer_id`.

  **Виды соединений:**

  - `JOIN` (`INNER JOIN`) — только пары, нашедшие друг друга;
  - `LEFT JOIN` — все строки левой таблицы; если пары нет, колонки правой заполняются NULL;
  - `RIGHT JOIN` — то же для правой, `FULL JOIN` — для обеих;
  - `CROSS JOIN` — все со всеми: 5 строк × 30 строк = 150.

  **Anti-join** — «строки без пары»: `LEFT JOIN … WHERE правая.id IS NULL`.

  **Условие в ON и в WHERE — не одно и то же.** Для `LEFT JOIN` условие в `ON` ограничивает, какие строки справа присоединяются, а условие в `WHERE` выкидывает строки уже после соединения — и превращает LEFT JOIN в обычный.

  **Размножение строк.** Если у клиента 3 заказа и 2 отзыва, соединение с обеими таблицами даст 3 × 2 = 6 строк. Считайте через `COUNT(DISTINCT …)` или агрегируйте таблицы до соединения.

  **COUNT после LEFT JOIN.** `COUNT(*)` посчитает и строку-заглушку с NULL — у товара без отзывов получится 1. Считайте колонку правой таблицы: `COUNT(r.review_id)`.

  **Self-join** — соединение таблицы с самой собой, например сотрудника с руководителем: `employees e JOIN employees m ON m.employee_id = e.manager_id`.
tasks:
  - id: L04-01
    type: write_query
    difficulty: 1
    customer: Поддержка
    title: Заказы 1 июня
    ticket: Поддержке нужны заказы за 1 июня 2026 года с именем клиента — order_id, first_name, last_name, amount.
    tables: [orders, customers]
    expected_columns: [order_id, first_name, last_name, amount]
    required: [join]
    reference: |
      SELECT o.order_id, c.first_name, c.last_name, o.amount
      FROM orders AS o
      JOIN customers AS c ON c.customer_id = o.customer_id
      WHERE o.created_at::date = '2026-06-01';
    hints:
      - Имя клиента лежит в другой таблице — её нужно присоединить.
      - "orders и customers связаны по customer_id."
      - "1) FROM orders. 2) JOIN customers ON совпадение customer_id. 3) Фильтр по дате."
      - "FROM orders AS o JOIN customers AS c ON c.customer_id = ___.customer_id WHERE o.created_at::date = '2026-06-01'"
      - "JOIN … ON склеивает каждую строку заказа со строкой клиента, у которого тот же customer_id. Псевдонимы o и c делают запрос короче."

  - id: L04-02
    type: write_query
    difficulty: 1
