      - "1) Соедини товары с категориями. 2) Отфильтруй бренд. 3) Переименуй обе колонки name."
      - "SELECT p.name AS product, c.name AS ___ FROM products AS p JOIN categories AS c ON …"
      - "Одноимённые колонки разных таблиц различаются по префиксу псевдонима: p.name и c.name."

  - id: L04-03
    type: write_query
    difficulty: 2
    customer: Поддержка
    title: Состав заказа
    ticket: Клиент спрашивает, что было в заказе № 1402. Нужны name товара, quantity, price и line_total (количество × цена).
    tables: [order_items, products]
    expected_columns: [name, quantity, price, line_total]
    check_column_names: true
    reference: |
      SELECT p.name, oi.quantity, oi.price, oi.quantity * oi.price AS line_total
      FROM order_items AS oi
      JOIN products AS p ON p.product_id = oi.product_id
      WHERE oi.order_id = 1402;
    hints:
      - Позиции заказа лежат в order_items, а названия — в products.
      - "Цену бери из order_items: она зафиксирована на момент покупки."
      - "1) FROM order_items. 2) JOIN products по product_id. 3) Фильтр order_id = 1402. 4) Вычисли line_total."
      - "SELECT p.name, oi.quantity, oi.price, oi.quantity * oi.price AS line_total FROM order_items AS oi JOIN products AS p ON … WHERE oi.order_id = ___;"
      - "oi.price — цена в момент заказа, p.price — текущая цена в каталоге. Для истории заказа важна первая."

  - id: L04-04
    type: write_query
    difficulty: 2
    customer: Маркетинг
    title: Зарегистрировались и пропали
    ticket: Нужен список клиентов, которые зарегистрировались в 2025 году, но не сделали ни одного заказа, — customer_id, email, registered_at, по дате регистрации.
    tables: [customers, orders]
    expected_columns: [customer_id, email, registered_at]
    ordered: true
    required: [join]
    bonus:
      text: Решить через LEFT JOIN, без подзапроса
      forbidden: [subquery]
    reference: |
      SELECT c.customer_id, c.email, c.registered_at
      FROM customers AS c
      LEFT JOIN orders AS o ON o.customer_id = c.customer_id
      WHERE o.order_id IS NULL
        AND c.registered_at >= '2025-01-01'
        AND c.registered_at < '2026-01-01'
      ORDER BY c.registered_at;
    common_mistakes:
      - pattern: "=\\s*NULL"
        explain: "= NULL всегда даёт NULL — для поиска строк без пары нужен IS NULL."
    hints:
      - Нужны клиенты, у которых нет пары в orders.
      - "LEFT JOIN сохраняет клиента, даже если заказов нет, — колонки orders будут NULL."
      - "1) customers LEFT JOIN orders. 2) Оставь строки, где заказ не нашёлся. 3) Фильтр 2025 года. 4) Сортировка."
      - "FROM customers AS c LEFT JOIN orders AS o ON o.customer_id = c.customer_id WHERE o.order_id IS ___ AND …"
      - "Это anti-join: LEFT JOIN дополняет клиентов без заказов NULL-ами, а WHERE o.order_id IS NULL оставляет только их."

