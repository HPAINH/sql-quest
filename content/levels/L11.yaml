  - id: L11-14
    type: optimize
    boss: true
    difficulty: 3
    customer: Data Science
    title: "Инцидент: витрина признаков"
    ticket: |
      Ночной расчёт витрины признаков перестал укладываться в окно. Перепишите отчёт так, чтобы оценка стоимости плана стала минимум в 5 раз меньше, а результат не изменился.
      Для клиентов, зарегистрированных до 2026-01-01: customer_id; orders_cnt, total_amount и last_order_at — по неотменённым заказам до 2026-01-01; reviews_cnt — отзывы до 2026-01-01; target — 1, если был неотменённый заказ в первом квартале 2026 года, иначе 0.
    tables: [customers, orders, reviews]
    expected_columns: [customer_id, orders_cnt, total_amount, last_order_at, reviews_cnt, target]
    check_column_names: true
    start_sql: |
      SELECT c.customer_id,
             (SELECT COUNT(*) FROM orders o WHERE o.customer_id = c.customer_id AND o.status <> 'cancelled' AND o.created_at < '2026-01-01') AS orders_cnt,
             (SELECT COALESCE(SUM(o.amount), 0) FROM orders o WHERE o.customer_id = c.customer_id AND o.status <> 'cancelled' AND o.created_at < '2026-01-01') AS total_amount,
             (SELECT MAX(o.created_at) FROM orders o WHERE o.customer_id = c.customer_id AND o.status <> 'cancelled' AND o.created_at < '2026-01-01') AS last_order_at,
             (SELECT COUNT(*) FROM reviews r WHERE r.customer_id = c.customer_id AND r.created_at < '2026-01-01') AS reviews_cnt,
             CASE WHEN EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id AND o.status <> 'cancelled' AND o.created_at >= '2026-01-01' AND o.created_at < '2026-04-01') THEN 1 ELSE 0 END AS target
      FROM customers c
      WHERE c.registered_at < '2026-01-01';
    plan:
      max_cost_ratio: 0.2
    reference: |
      WITH o AS (
        SELECT customer_id,
               COUNT(*) FILTER (WHERE created_at < '2026-01-01') AS orders_cnt,
               COALESCE(SUM(amount) FILTER (WHERE created_at < '2026-01-01'), 0) AS total_amount,
               MAX(created_at) FILTER (WHERE created_at < '2026-01-01') AS last_order_at,
               MAX(CASE WHEN created_at >= '2026-01-01' AND created_at < '2026-04-01' THEN 1 ELSE 0 END) AS target
        FROM orders
        WHERE status <> 'cancelled'
        GROUP BY customer_id
      ),
      r AS (
        SELECT customer_id, COUNT(*) AS reviews_cnt
        FROM reviews
        WHERE created_at < '2026-01-01'
        GROUP BY customer_id
      )
      SELECT c.customer_id,
             COALESCE(o.orders_cnt, 0) AS orders_cnt,
             COALESCE(o.total_amount, 0) AS total_amount,
             o.last_order_at,
             COALESCE(r.reviews_cnt, 0) AS reviews_cnt,
             COALESCE(o.target, 0) AS target
      FROM customers AS c
      LEFT JOIN o ON o.customer_id = c.customer_id
      LEFT JOIN r ON r.customer_id = c.customer_id
      WHERE c.registered_at < '2026-01-01';
    hints:
      - "Пять подзапросов на каждого из тысяч клиентов — это тысячи маленьких запросов. Все признаки по заказам можно посчитать одной группировкой, а по отзывам — второй."
      - "CTE o: одна группировка orders по клиенту с FILTER для признаков и для target. CTE r: отзывы до среза. Затем customers LEFT JOIN o LEFT JOIN r."
      - "1) o: COUNT, SUM, MAX с FILTER (WHERE created_at < срез), target через MAX(CASE …). 2) r: COUNT отзывов. 3) LEFT JOIN обоих к клиентам и COALESCE для тех, у кого нет записей."
      - "WITH o AS (SELECT customer_id, COUNT(*) FILTER (WHERE created_at < '2026-01-01') AS orders_cnt, …, MAX(CASE WHEN created_at >= '2026-01-01' AND created_at < '2026-04-01' THEN 1 ELSE 0 END) AS target FROM orders WHERE status <> 'cancelled' GROUP BY customer_id), r AS (…) SELECT … FROM customers c LEFT JOIN o … LEFT JOIN r … WHERE c.registered_at < '2026-01-01';"
      - "Агрегация до соединения читает каждую таблицу один раз и не размножает строки, а COALESCE возвращает нули тем, у кого нет заказов или отзывов. Так строят витрины признаков: один проход на источник, затем JOIN по ключу сущности."
